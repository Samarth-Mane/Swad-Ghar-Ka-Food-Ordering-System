<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Swad Ghar Ka | Sign Up</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:white
    }

    .container{
      display:flex;
      width:900px;
      background:white;
      border-radius:20px;
      overflow:hidden;
      box-shadow:0 10px 30px rgba(0,0,0,0.2);
    }

    .left{
      flex:1;
      background:url('images/paneer.jpg') center/cover;
      min-height:600px;
    }

    .right{
      flex:1;
      padding:50px;
      display:flex;
      flex-direction:column;
      justify-content:center;
    }

    .right h2{
      font-size:32px;
      margin-bottom:10px;
      color:#333;
    }

    .right p{
      margin-bottom:30px;
      color:#777;
    }

    .input-group{
      position:relative;
      margin-bottom:25px;
    }

    .input-group input{
      width:100%;
      padding:15px;
      border:1px solid #ccc;
      border-radius:10px;
      outline:none;
      font-size:16px;
    }

    .input-group label{
      position:absolute;
      top:50%;
      left:15px;
      transform:translateY(-50%);
      background:white;
      padding:0 5px;
      color:#999;
      transition:0.3s;
      pointer-events:none;
    }

    .input-group input:focus + label,
    .input-group input:not(:placeholder-shown) + label{
      top:0;
      font-size:12px;
      color:#ff6b35;
    }

    .password-toggle{
      position:absolute;
      right:15px;
      top:50%;
      transform:translateY(-50%);
      cursor:pointer;
    }

    button{
      width:100%;
      padding:15px;
      border:none;
      border-radius:10px;
      background:#ff6b35;
      color:white;
      font-size:18px;
      cursor:pointer;
      transition:0.3s;
    }

    button:hover{
      background:#e55a2b;
    }

    .msg{
      margin-top:15px;
      text-align:center;
      font-weight:bold;
    }

    .login-link{
      margin-top:20px;
      text-align:center;
    }

    .login-link a{
      color:#ff6b35;
      text-decoration:none;
      font-weight:bold;
    }

  </style>
</head>

<body>

<div class="container">

  <!-- LEFT IMAGE -->
  <div class="left"></div>

  <!-- RIGHT FORM -->
  <div class="right">

    <h2>Create Account</h2>
    <p>Join Swad Ghar Ka today 🍛</p>

    <!-- NAME -->
    <div class="input-group">
      <input
        type="text"
        id="name"
        required
        placeholder=" "
      >
      <label>Full Name</label>
    </div>

    <!-- EMAIL -->
    <div class="input-group">
      <input
        type="email"
        id="email"
        required
        placeholder=" "
      >
      <label>Email Address</label>
    </div>

    <!-- PHONE -->
    <div class="input-group">
      <input
        type="tel"
        id="phone"
        required
        placeholder=" "
      >
      <label>Phone Number</label>
    </div>

    <!-- PASSWORD -->
    <div class="input-group">
      <input
        type="password"
        id="password"
        required
        placeholder=" "
      >
      <label>Password</label>

      <span
        class="password-toggle"
        onclick="togglePass('password')"
      >
        👁️
      </span>
    </div>

    <!-- CONFIRM PASSWORD -->
    <div class="input-group">
      <input
        type="password"
        id="confirmPassword"
        required
        placeholder=" "
      >
      <label>Confirm Password</label>

      <span
        class="password-toggle"
        onclick="togglePass('confirmPassword')"
      >
        👁️
      </span>
    </div>

    <!-- BUTTON -->
    <button
      type="button"
      onclick="handleRegister()"
    >
      Sign Up
    </button>

    <!-- MESSAGE -->
    <p class="msg" id="msg"></p>

    <!-- LOGIN LINK -->
    <p class="login-link">
      Already have an account?
      <a href="login.html">Log In</a>
    </p>

  </div>

</div>

<!-- API FILE -->
<script src="api.js"></script>

<script>

  // SHOW / HIDE PASSWORD

  function togglePass(id){

    let field =
      document.getElementById(id);

    field.type =
      field.type === "password"
        ? "text"
        : "password";
  }

  // REGISTER FUNCTION

  async function handleRegister(){

    const name =
      document.getElementById("name").value;

    const email =
      document.getElementById("email").value;

    const phone =
      document.getElementById("phone").value;

    const password =
      document.getElementById("password").value;

    const confirmPassword =
      document.getElementById("confirmPassword").value;

    const msg =
      document.getElementById("msg");

    // VALIDATION

    if(
      !name ||
      !email ||
      !phone ||
      !password ||
      !confirmPassword
    ){

      msg.textContent =
        "⚠️ Please fill all fields";

      msg.style.color = "orange";

      return;
    }

    if(password.length < 6){

      msg.textContent =
        "❌ Password must be at least 6 characters";

      msg.style.color = "red";

      return;
    }

    if(password !== confirmPassword){

      msg.textContent =
        "❌ Passwords do not match";

      msg.style.color = "red";

      return;
    }

    try{

      // CALL BACKEND API

      const result =
        await registerUser(
          name,
          email,
          password,
          phone
        );

      console.log(result);

      if(result.success){

        msg.textContent =
          "✅ Registration successful!";

        msg.style.color = "green";

        setTimeout(() => {

          window.location.href =
            "login.html";

        }, 1500);

      } else {

        msg.textContent =
          result.message;

        msg.style.color = "red";
      }

    } catch(error){

      console.error(error);

      msg.textContent =
        "❌ Server error";

      msg.style.color = "red";
    }
  }

</script>

</body>
</html>
